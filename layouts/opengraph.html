<div style="background-color: #ffffff; color: #191919; padding: 40px; font-family: 'Newsreader', 'Iowan Old Style', Georgia, serif; line-height: 1.4;" data-content-background="#ffffff" data-avatar-background="#b86131"{{ with site.Params.custom_avatar }} data-avatar-url="{{ . }}"{{ end }}>
  {{- with .Title }}
  <b style="font-size: 30px; font-weight: 500; line-height: 1.15; margin-bottom: 16px; display: block;">{{ . }}</b>
  {{- end }}
  {{- with .Summary }}
  <p style="font-size: 20px; line-height: 1.45; margin: 0;">{{ . | plainify | htmlUnescape | truncate 220 }}</p>
  {{- end }}
</div>
