{{- /* The scripts a post's embeds need, only where one shows. Takes the HTML
       the caller has just written (a post's body, a page of cards) and
       writes them after it, not inside e-content:
       - hls.js, the Video streaming plug-in's player, beside a <video> or
         <source> with an .m3u8 address (2.0.30; Jamie, 2026-10-25:
         "Approved: thing-hugo loads hls.js only on pages that show a
         streaming video, to main after the full gate"). The plug-in lists
         it for every page, about 151 KB compressed, and three posts of
         10,477 have a streaming video; plain MP4 needs no player, and
         Safari plays HLS itself. A deferred script still runs before
         DOMContentLoaded, when the plug-in's studio.js hands it the video.
       - js/video.js beside a YouTube card (youtube.html, 2.0.31), which
         swaps in the player on a click. */ -}}
{{- $html := string . -}}
{{- if findRE `<(video|source)\b[^>]*\.m3u8` $html 1 }}
  {{- range site.Params.plugins_js }}
    {{- if strings.Contains . "hls.js" }}{{ partial "plugin-script.html" . }}{{ end }}
  {{- end }}
{{- end }}
{{- if strings.Contains $html "data-youtube=" }}
<script src="{{ partial "asset.html" "js/video.js" }}" defer></script>
{{- end }}
