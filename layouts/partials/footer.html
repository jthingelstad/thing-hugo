<footer class="site-footer">
  <div class="site-footer__inner">
    {{ partial "signup.html" . }}
    {{ partial "sites-footer.html" . }}

    <div class="site-footer__meta">
      <p class="site-footer__copy">{{ with site.Copyright }}{{ . | safeHTML }}{{ else }}© {{ now.Year }} {{ site.Params.author.name | default site.Title }}{{ end }}</p>
      <p class="site-footer__links">
        <a href="{{ "feed.xml" | absURL }}">RSS</a>
        <a href="{{ "feed.json" | absURL }}">JSON</a>
        {{ if site.Params.llmsTxtEnabled }}<a href="{{ "llms.txt" | absURL }}">llms.txt</a>{{ end }}
      </p>
    </div>
  </div>
</footer>
