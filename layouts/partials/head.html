<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ if .IsHome }}{{ $.Site.Params.subtitle | default $.Site.Params.description }}{{ else }}{{ .Summary | plainify }}{{ end }}">
{{ with $.Site.Params.keywords }}<meta name="keywords" content="{{ . }}">{{ end }}
<link rel="canonical" href="{{ .Permalink }}">

<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ "feed.xml" | absURL }}">
<link rel="alternate" type="application/json" title="{{ $.Site.Title }}" href="{{ "feed.json" | absURL }}">
{{ if $.Site.Params.llmsTxtEnabled }}
  <link rel="alternate" type="text/plain" title="LLMs.txt" href="{{ "llms.txt" | absURL }}">
{{ end }}

<link rel="stylesheet" href="{{ "css/thing.css" | absURL }}">
<link rel="stylesheet" href="{{ "style.css" | absURL }}"><!-- user overrides via micro.blog Design -->

<meta name="theme-color" content="{{ $.Site.Params.primaryColor | default "#2a5d8f" }}">

<!-- Open Graph -->
<meta property="og:site_name" content="{{ $.Site.Title }}">
<meta property="og:title" content="{{ if .IsHome }}{{ $.Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .IsHome }}{{ $.Site.Params.subtitle | default $.Site.Params.description }}{{ else }}{{ .Summary | plainify }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
{{ with .Params.images }}{{ range first 1 . }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}{{ end }}
{{ if .IsPage }}
  <meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
  {{ range .Params.tags }}<meta property="article:tag" content="{{ . }}">{{ end }}
{{ end }}

<!-- Twitter -->
<meta name="twitter:card" content="summary">

{{ partial "extended_head.html" . }}

{{ partial "microblog_head.html" . }}
