{{ define "title" }}<title>Search · {{ $.Site.Title }}</title>{{ end }}

{{ define "main" }}
<section class="search-page">
  <h1>Search</h1>
  <p class="search-page__blurb">Full-text search powered by <a href="https://pagefind.app">Pagefind</a>.</p>
  <div id="search"></div>
</section>
{{ end }}

{{ define "footer" }}
  {{ partial "footer.html" . }}
  <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
  <script src="/pagefind/pagefind-ui.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      new PagefindUI({
        element: "#search",
        showSubResults: true,
        showImages: false,
        resetStyles: false
      });
    });
  </script>
{{ end }}
